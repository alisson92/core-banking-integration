{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cbi.fullname" . }}
  labels:
    {{- include "cbi.labels" . | nindent 4 }}
type: Opaque
stringData:
  service-api-key: {{ .Values.secrets.serviceApiKey | quote }}
  core-api-key: {{ .Values.secrets.coreApiKey | quote }}
{{- end }}
